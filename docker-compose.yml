services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: elite
      POSTGRES_USER: elite
      POSTGRES_PASSWORD: elite
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elite -d elite"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://elite:elite@db:5432/elite
      TEST_DATABASE_URL: postgresql+psycopg://elite:elite@db:5432/elite
      JWT_SECRET: local-jwt-change-me-at-least-32-bytes
      TICKET_SECRET: local-ticket-change-me-at-least-32-bytes
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CURRENCY: brl
      STRIPE_CHECKOUT_EXPIRATION_MINUTES: 30
      STRIPE_TEST_MODE: "true"
      APP_ENV: development
      APP_TIMEZONE: America/Sao_Paulo
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
